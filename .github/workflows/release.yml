# Actions are pinned to a full-length commit SHA; see the note in ci.yml.
name: Release

on:
  push:
    # Three numbers, nothing else. `v*` also matched `v-probe`, `vtest` and
    # every other tag somebody might push to see what happens -- and pushing a
    # tag here publishes to PyPI with no approval step, which is not a thing to
    # find out by accident. A prerelease needs this widened on purpose, which
    # is the point rather than the cost. GitHub's filter dialect: `[0-9]+` is
    # one or more digits, and the pattern must match the whole ref.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

# Unlike CI, this must not cancel: killing a release between "published to PyPI"
# and "attached to the GitHub release" leaves a version that exists in one place
# and not the other. Queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag itself is the version source; a shallow clone yields 0.0.0.
          fetch-depth: 0
          # This job builds; it never pushes. Do not leave GITHUB_TOKEN in
          # .git/config for the build to trip over.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      # 0.1.0 was withdrawn over exactly this distinction: the working tree was
      # clean and the artifact was not. CI audits the fixtures in the tree on
      # every change, which is the check that already passed that day. This is
      # the only one that reads the copies about to be published, and `publish`
      # waits on it through `needs`.
      #
      # The audit is run with the built wheel installed, so the artifact's own
      # decoder reads the artifact's own fixtures. An empty match is a failure
      # rather than a pass: a gate that finds nothing to check is the shape of
      # the problem, not the absence of one.
      - name: Audit the fixtures inside the sdist
        run: |
          python -m pip install dist/*.whl
          mkdir -p sdist-audit
          tar -xzf dist/*.tar.gz -C sdist-audit
          shopt -s nullglob
          fixtures=(sdist-audit/*/tests/fixtures/*.jsonl.gz)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "::error::No captures found inside the sdist; the audit would have passed by checking nothing."
            exit 1
          fi
          printf 'auditing %s\n' "${fixtures[@]}"
          python tools/audit_capture.py "${fixtures[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ostrace
    permissions:
      # Trusted Publishing: PyPI verifies a short-lived OIDC token issued to
      # this workflow. No API token is stored anywhere, so there is none to
      # leak. The owner/repo binding is configured on PyPI and must be updated
      # if the repository is ever transferred.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # PyPA publish their own guide with `@release/v1`, a branch, so that they
      # can ship security fixes without waiting on a pull request here. Pinning
      # trades that away for reproducibility: this is the step holding the OIDC
      # identity, and a moving reference is exactly what should not be trusted
      # at that point. The trade is only sound while the Dependabot bumps get
      # merged -- a stale pin here is worse than the branch was.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Attach distributions to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # `gh` is preinstalled on the runner and does this job, so a third-party
      # action is a supply-chain dependency bought for nothing -- and it would
      # have been the only one here holding `contents: write`. The tag name and
      # repository come through the environment rather than `${{ }}`, which
      # keeps a crafted ref out of the shell.
      - name: Create the release and attach the distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
