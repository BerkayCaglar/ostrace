# Actions are pinned to a full-length commit SHA, not a tag. A tag is mutable:
# whoever controls the action's repository can repoint it at different code
# without anything here changing. The trailing comment records which release the
# SHA is, and Dependabot keeps both in step -- so the pin costs nothing to
# maintain. `sha_pinning_required` is enforced on the repository as well, which
# means a tag reintroduced by hand is rejected rather than silently accepted.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from tags; a shallow clone has none.
          fetch-depth: 0
          # checkout leaves GITHUB_TOKEN in .git/config unless told not to.
          # Nothing here pushes, so every later step -- including whatever
          # `pip install -e .` decides to execute -- would be able to read a
          # credential it has no use for.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        # The gui extra is needed here even though this job runs no GUI: mypy
        # cannot check src/ostrace/gui without PySide6, and would silently
        # report success on a package it never looked at.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" --group dev

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

      # The workflows are the only thing here that runs with privilege, so they
      # get a linter of their own.
      - name: zizmor
        run: zizmor --persona=regular .github/workflows

      # The fixtures are real device output committed to a public repository,
      # and the sdist ships tests/. A regenerated fixture that reintroduces an
      # identifier is the failure this gate exists to make loud. The same check
      # runs in the test suite; it is here as well so that a lint-only run
      # cannot miss it.
      - name: Audit the fixtures for device identifiers
        run: |
          python tools/audit_capture.py \
            tests/fixtures/ios26-mixed.jsonl.gz \
            tests/fixtures/ios26-errors.jsonl.gz

      # Type-check every target platform, not just the runner's. Windows-only
      # and macOS-only branches are otherwise never checked at all: this job
      # runs on Linux, and mypy narrows sys.platform to whatever it is running
      # on. Catching an AttributeError on a name that does not exist on macOS
      # is worth three seconds.
      - name: mypy (linux)
        run: mypy --platform linux
      - name: mypy (windows)
        run: mypy --platform win32
      - name: mypy (macos)
        run: mypy --platform darwin

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full interpreter sweep runs on Linux only; Windows and macOS
        # verify that the code is portable, not that it works on four
        # interpreters. Linux is in the matrix specifically to catch
        # case-sensitivity bugs, which macOS will not surface by default.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          # Pinned rather than macos-latest: the latest label migrates to a new
          # major release mid-year, which would change CI under us on a date we
          # did not choose. Bump this deliberately.
          - os: macos-15
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Test
        # Device tests need a physical iPhone over USB and can never pass on a
        # hosted runner. --strict-markers means a typo in the marker fails.
        # GUI tests are excluded here and run in their own job: what they
        # verify is portability across operating systems, not across four
        # interpreters, and Qt is a 78-110 MB download per job.
        run: pytest -m "not device and not gui" --cov=ostrace --cov-report=term-missing

      - name: Verify the console script is installed and runnable
        run: ostrace --version

  gui:
    name: GUI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One interpreter, three operating systems -- the opposite shape to the
      # test job above, because Qt behaviour differs by platform and not by
      # Python version.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    env:
      # Renders without a display, a window manager or xvfb on all three.
      # Nothing here asserts a font metric: the offscreen font database is
      # empty on Windows, so QFontMetrics returns numbers for a fallback face
      # that no user will ever see.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        # libegl1 and libgl1 are the proven minimum; the rest are DT_NEEDED
        # entries of libQt6Gui.so.6 that happen to be preinstalled today and
        # are not contractually guaranteed to stay that way.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" --group dev

      - name: Verify Qt is actually installed
        # Without this, a missing extra turns every GUI test into a skip and
        # the job goes green having verified nothing at all.
        run: python -c "import PySide6; print(PySide6.__version__)"

      - name: Test
        # `python -X faulthandler -m pytest` rather than the console script.
        # pytest enables faulthandler for the run and switches it off again
        # when the session ends -- and the one failure this job has ever had
        # was the process exiting 1 *after* reporting 159 passed, with nothing
        # on either stream. Whatever that was, it happened outside the window
        # pytest covers. `-X` covers the whole process, so the next occurrence
        # arrives as a traceback instead of a mystery.
        #
        # `not device` is not redundant with the marker: pytest marker
        # selection is set membership, so `-m gui` collects anything carrying
        # `gui`, including a test that also carries `device`. One does --
        # `test_gui_live.py` marks the whole module `gui` -- and it ran here
        # with no hardware attached and passed, which is the worst answer a
        # device test can give.
        run: python -X faulthandler -m pytest -m "gui and not device" -ra

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
